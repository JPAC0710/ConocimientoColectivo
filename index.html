<style>

<body>
<header>
  <div class="logo">LABORATORIO<br><span class="a">VIVO</span></div>
  <nav id="nav"></nav>
  <div class="tools" style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn" data-a="kiosco" title="Modo kiosco / proyección">K</button>
    <button class="btn y" data-a="hc" title="Alto contraste">HC</button>
    <button class="btn" data-a="fs" data-d="-0.1" aria-label="Texto más pequeño">A-</button>
    <button class="btn" data-a="fs" data-d="0.1" aria-label="Texto más grande">A+</button>
    <button class="btn a" data-a="csv">CSV</button>
  </div>
</header>
<main id="app"></main>
<div id="tick"></div><div id="toast" role="status"></div><div id="modal"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TEMA="movimiento cuerpo tenis mesa",TITULO="¿QUIÉN MUEVE QUÉ?";
const Q=[
{k:"q1",f:"RESPUESTA ABIERTA",t:"Si tu movimiento fuera una imagen, ¿cómo lo representarías?",h:"Imagina que puedes convertir un movimiento de tu cuerpo en una imagen. ¿Qué elementos, formas, colores, texturas o recursos utilizarías para representarlo?",tipo:"abierta"},
{k:"q2",f:"SELECCIÓN ÚNICA",t:"¿La postura es un dato o un relato?",tipo:"unica",o:["Un dato.","Un relato.","Ambas cosas.","Ninguna de las anteriores.","No estoy seguro/a."],c:["Dato","Relato","Ambas","Ninguna","No sé"]},
{k:"q3",f:"SELECCIÓN MÚLTIPLE",t:"¿Qué puede expresar la postura de un jugador?",h:"Puedes seleccionar varias opciones.",tipo:"multi",o:["Una posición del cuerpo que se puede observar y medir.","Una señal de equilibrio y estabilidad.","Una respuesta a las condiciones del juego.","Una expresión de la técnica y la experiencia del jugador.","Una forma de comunicar intención o estrategia.","Una experiencia corporal que va más allá de los datos.","Otra. ¿Cuál?"],c:["Observable y medible","Equilibrio y estabilidad","Respuesta al juego","Técnica y experiencia","Intención o estrategia","Más allá de los datos","Otra"]},
{k:"q4",f:"SELECCIÓN MÚLTIPLE",t:"¿Qué necesitamos para comprender el movimiento del cuerpo?",h:"Puedes seleccionar varias opciones.",tipo:"multi",o:["Medir sus desplazamientos y posiciones.","Observar cómo realiza un movimiento.","Analizar su velocidad, fuerza y coordinación.","Comprender el contexto en el que se mueve.","Reconocer la experiencia de quien realiza el movimiento.","Representarlo mediante imágenes, colores, formas o animaciones.","Combinar datos, imágenes y observación.","Otra. ¿Cuál?"],c:["Medir desplazamientos","Observar el movimiento","Velocidad, fuerza, coordinación","Comprender el contexto","Experiencia de quien se mueve","Representarlo en imagen","Combinar datos e imágenes","Otra"]}];
const tt=a=>(a.texto||"")+" "+(a.q3o||"")+" "+(a.q4o||"");
const STOP=new Set("para como pero porque cuando donde desde hasta entre sobre tambien esta este estos estas esto eso esa ese esos esas aqui alli muy mas menos pues tiene tienen hacer hace puede pueden cada todo todos toda todas otro otra otros otras son era fue hay sido sus los las del una uno unos unas por con sin que mis nos les algo solo asi tanto tan bien quien cual creo quisiera gustaria mucho muchos mucha muchas poco hacia segun durante mismo misma ante bajo tipo forma parte ser estar tener tengo sino aunque mientras luego siempre nunca ahora entonces puedo podria deberia vez veces cosa cosas estan".split(" "));
const norm=s=>s.normalize("NFD").replace(/\p{M}/gu,"");
const raiz=w=>{let s=norm(w.toLowerCase());if(s.endsWith("ciones"))return s.slice(0,-6)+"cion";if(s.length>5&&/(ores|ones|ales|ares|ices|udes)$/.test(s))return s.slice(0,-2);if(s.length>4&&s.endsWith("s"))return s.slice(0,-1);return s};
const DISP={},lab=r=>DISP[r]||r;
function pals(txt,tema){const ex=new Set((tema||"").split(/\s+/).map(raiz)),out=new Set();for(const w of (txt||"").toLowerCase().replace(/[^\p{L}]+/gu," ").split(" ")){if(w.length<4||STOP.has(norm(w)))continue;const r=raiz(w);if(r.length<3||ex.has(r))continue;out.add(r);if(!DISP[r]||w.length<DISP[r].length)DISP[r]=w}return out}
const PM=new WeakMap(),P=a=>{let p=PM.get(a);if(!p){p=pals(tt(a),a.tema);PM.set(a,p)}return p};
const cl=(v,a,b)=>Math.min(b,Math.max(a,v)),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const C=n=>getComputedStyle(document.documentElement).getPropertyValue("--"+n).trim();
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16)),mix=(a,b,t)=>{const x=hex(a),y=hex(b);return"rgb("+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(",")+")"};
const sies=a=>[0,1,.5,-1,-1][a.q2]??-1,q2t=a=>a.q2>=0?Q[1].c[a.q2]:"sin respuesta";

/* ---------- estado y datos ---------- */
let S={tema:TEMA,v:"inicio",ap:[],vi:[],sel:{q2:-1,q3:[],q4:[]},buscar:"",modoRed:"PALABRAS",conectando:false,selA:null,kiosco:false,draft:{tx:"",o3:"",o4:""}};
let dbAp=[],dbVi=[],DB=null,cargado=false,pend={ap:LS.g("cc_ap",[]),vi:LS.g("cc_vi",[])};
const BASE=LS.g("cc_visita",{});
const uniq=a=>[...new Map(a.map(x=>[x.id,x])).values()];
function merge(){S.ap=uniq(dbAp.concat(pend.ap)).sort((a,b)=>a.t-b.t);S.ap.forEach(P);S.vi=uniq(dbVi.concat(pend.vi)).sort((a,b)=>a.t-b.t)}
const freq=L=>{const f=new Map();L.forEach(a=>P(a).forEach(w=>f.set(w,(f.get(w)||0)+1)));return f};
const ord=f=>[...f.keys()].sort((a,b)=>f.get(b)-f.get(a)||a.localeCompare(b));
const delTema=()=>S.ap.filter(a=>a.tema===S.tema),vincT=()=>S.vi.filter(v=>v.tema===S.tema);
const claves=(L=delTema())=>{const f=freq(L);return ord(f).filter(w=>f.get(w)>=2)};
const temas=()=>[...new Set(S.ap.map(a=>a.tema))];
function diff(){const b=BASE[S.tema];if(!b)return{primera:true};const L=delTema(),f=freq(L),nc=ord(f).filter(w=>f.get(w)>=2&&!(b.claves||[]).includes(w)),da=Math.max(0,L.length-b.n),dv=Math.max(0,vincT().length-b.v);return{da,dv,nc,hay:da||dv||nc.length}}
function guardarVisita(){if(!cargado)return;const o={...BASE};temas().forEach(t=>{const L=S.ap.filter(a=>a.tema===t),f=freq(L);o[t]={t:Date.now(),n:L.length,v:S.vi.filter(v=>v.tema===t).length,claves:[...f.keys()].filter(w=>f.get(w)>=2)}});LS.s("cc_visita",o)}
async function guardar(col,obj,demo){
  const k=col==="aportes"?"ap":"vi";
  if(demo)obj.demo=true;
  pend[k].push(obj);LS.s("cc_"+k,pend[k]);merge();
  if(demo)return true;
  if(DB){try{await DB.collection(col).doc(obj.id).set(obj);pend[k]=pend[k].filter(x=>x.id!==obj.id);LS.s("cc_"+k,pend[k]);return true}catch(e){toast("Se guardó solo en tu navegador: tu acceso no permite escribir en la red compartida");return false}}
  toast("Sin conexión con la red compartida: guardado en tu navegador");return false}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3200)}
function burst(){for(let i=0;i<60;i++){const s=document.createElement("span");s.className="conf";s.style.cssText=`left:50%;top:40%;background:${C(["acid","mag","cyan","yel"][i%4])};--x:${(Math.random()-.5)*700}px;--y:${(Math.random()-.3)*600}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}

/* ---------- navegación ---------- */
const TABS=[["inicio","INICIO"],["participar","PARTICIPAR"],["aportes","APORTES"],["red","RED"],["datos","DATOS"],["tiempo","TIEMPO"]];
function go(v){S.v=v;S.conectando=false;S.selA=null;cancelAnimationFrame(G.raf);render();window.scrollTo(0,0)}
function render(){
  $("#nav").innerHTML=TABS.map(([k,n])=>`<button class="btn ${k===S.v?"fill a":""}" data-a="go" data-v="${k}">${n}</button>`).join("");
  ({inicio,participar,aportes,red,datos,tiempo})[S.v]($("#app"));
  const t=`<span>${TITULO} // ${delTema().length} RESPUESTAS // ${claves().map(w=>esc(lab(w).toUpperCase())).join(" * ")}</span>`;
  if($("#tick").dataset.t!==t){$("#tick").innerHTML=t;$("#tick").dataset.t=t}
}
function refresh(){
  const ae=document.activeElement,typing=ae&&["INPUT","TEXTAREA"].includes(ae.tagName);
  if(S.v==="participar"){live();return}
  if(S.v==="aportes"&&ae&&ae.id==="bq"){pintaGrid();return}
  if(typing)return;render()}
const vacio=A=>{A.innerHTML=`<div style="text-align:center;padding:60px 0"><h2>AÚN NO HAY RESPUESTAS A</h2><h1 class="a">${TITULO}</h1><p><button class="btn m fill big" data-a="go" data-v="participar">SÉ LA PRIMERA PERSONA ›</button></p></div>`};

/* ---------- INICIO ---------- */
function inicio(A){
  const L=delTema(),f=freq(L),hayDemo=S.ap.some(a=>a.demo),nc=[...f.values()].filter(c=>c>=2).length;
  A.innerHTML=`<div class="split"><section class="hero"><p class="mono y">LABORATORIO VIVO // INSTRUMENTO DE CONSULTA AL PÚBLICO</p><h1>¿QUIÉN<br><span class="heat">MUEVE</span><br><span class="m">QUÉ?</span></h1><canvas id="trail" role="img" aria-label="Una pelota rebota y deja una estela de calor"></canvas>
  <p style="max-width:60ch">Te invitamos a responder cuatro preguntas sobre el movimiento en el tenis de mesa. No hay respuestas correctas o incorrectas: queremos conocer tu percepción y explorar cómo comprender un movimiento desde diferentes miradas, la ciencia, las artes y las humanidades.</p>
  <div class="row"><button class="btn m fill big" data-a="go" data-v="participar">RESPONDER ›</button><button class="btn c big" data-a="go" data-v="red">VER LA RED</button></div>
  <p class="mono c">${L.length?`YA HAY ${L.length} RESPUESTAS Y ${nc} PUNTOS CLAVE`:"SÉ LA PRIMERA PERSONA EN RESPONDER"}</p></section>
  <aside><h3>PROPÓSITO</h3><p style="margin:0">Conocer cómo perciben los asistentes el movimiento del cuerpo, qué aspectos consideran importantes para comprenderlo y cómo imaginan sus posibilidades de representación e interpretación.</p>
  <button class="btn y" data-a="sembrar">${hayDemo?"QUITAR EJEMPLOS":"CARGAR EJEMPLOS (SOLO EN TU NAVEGADOR)"}</button>
  <p class="mono g">${DB?"Red compartida activa: todas las personas ven las mismas respuestas.":"Modo local: tus respuestas se guardan solo en este navegador."}</p></aside></div>`;trail()}

function trail(){const cv=$("#trail");if(!cv||(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches))return;
  const id=trail.id=(trail.id||0)+1,dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext("2d");c.setTransform(dpr,0,0,dpr,0,0);
  const hot=["#2a0a6b","#8a1a8c","#e2482d","#ffb21c","#fffbe0"],pts=[],t0=Date.now();
  (function f(){if(trail.id!==id||S.v!=="inicio"||!$("#trail"))return;const t=(Date.now()-t0)/1000,x=W*(.5+.44*Math.sin(t*1.3)),y=H*.82-Math.abs(Math.sin(t*2.6))*H*.66;
    pts.push({x,y,a:1});pts.forEach(q=>q.a-=.014);while(pts.length&&pts[0].a<=0)pts.shift();c.clearRect(0,0,W,H);
    pts.forEach(q=>{c.globalAlpha=q.a;c.fillStyle=hot[Math.min(4,Math.floor(q.a*5))];c.beginPath();c.arc(q.x,q.y,2+q.a*7,0,7);c.fill()});c.globalAlpha=1;
    c.strokeStyle="rgba(242,234,217,.35)";c.beginPath();c.moveTo(0,H*.82+8);c.lineTo(W,H*.82+8);c.stroke();c.fillStyle="#f2ead9";c.beginPath();c.arc(x,y,6,0,7);c.fill();requestAnimationFrame(f)})()}

/* ---------- PARTICIPAR ---------- */
const optBtn=(qi,i)=>{const d=Q[qi],u=d.tipo==="unica",on=u?S.sel.q2===i:S.sel[d.k].includes(i);return `<button type="button" class="opt ${on?"sel":""}" role="${u?"radio":"checkbox"}" aria-checked="${on}" data-a="${u?"q2":"mc"}" data-q="${d.k}" data-i="${i}"><span class="bx">${u?(on?"●":"○"):(on?"■":"□")}</span><span>${esc(d.o[i])}</span></button>`};

function step(W,H){const N=G.nodes,n=N.length;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=N[i],b=N[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+30,d=Math.sqrt(d2),f=3200/d2;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}

const ncol=n=>n.centro?C("paper"):n.q?C({2:"mag",3:"acid",4:"cyan"}[n.q]):n.ap?(sies(n.ap)<0?C("gris"):mix(C("mag"),C("acid"),sies(n.ap))):n.c>=3?C("mag"):n.c===2?C("acid"):C("gris");

  G.edges.forEach(e=>{const a=N[e.i],b=N[e.j];c.globalAlpha=!hov||a===hov||b===hov?1:.3;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);

  const MI=[["Ciencia",a=>H3(a,"q3",[0,1])||H3(a,"q4",[0,2]),"cyan"],["Arte",a=>H3(a,"q3",[5])||H3(a,"q4",[5]),"mag"],["Humanidades",a=>H3(a,"q3",[2,3,4])||H3(a,"q4",[3,4]),"acid"],["Combinan miradas",a=>H3(a,"q4",[6]),"yel"]];
  const extra=`<h3>POSTURA: DATO ⟷ RELATO</h3><div class="spec" role="img" aria-label="Promedio entre dato y relato"><i style="left:calc(${(sm*100).toFixed(0)}% - 2px)"></i></div><p class="mono g" style="display:flex;justify-content:space-between;margin:0 0 18px"><span>DATO</span><span>RELATO</span></p>
  <div class="bars"><h3>MIRADAS (lectura aproximada de P3 y P4)</h3>${MI.map(([n,fn,col])=>{const c=L.filter(fn).length;return `<div class="r"><span>${n}</span><i style="width:${Math.max(2,100*c/L.length)}%;background:var(--${col})"></i><span class="mono">${c}</span></div>`}).join("")}<p class="mono g" style="margin:2px 0 18px">una respuesta puede sumar a varias miradas</p></div>`;
  A.innerHTML=`<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
  <section><div class="big-n a">${L.length}</div><p class="mono">RESPUESTAS</p><div class="big-n m">${nc}</div><p class="mono">PUNTOS CLAVE (PALABRAS REPETIDAS)</p>
  ${extra}<div class="bars"><h3>P1 · PALABRAS MÁS REPETIDAS</h3>${ws.slice(0,10).map(w=>`<div class="r"><span>${esc(lab(w).slice(0,18))}</span><i style="width:${Math.max(2,100*f.get(w)/top)}%;background:var(--${f.get(w)>=3?"mag":f.get(w)===2?"acid":"gris"})"></i><span class="mono">x${f.get(w)}</span></div>`).join("")}</div></section>
  <section class="bars"><h3>P2 · ¿LA POSTURA ES UN DATO O UN RELATO?</h3>${bar(Q[1],C2,"mag")}<h3 style="margin-top:20px">P3 · ¿QUÉ PUEDE EXPRESAR LA POSTURA?</h3>${bar(Q[2],C3,"acid")}</section>
  <section class="bars"><h3>P4 · ¿QUÉ NECESITAMOS PARA COMPRENDER EL MOVIMIENTO?</h3>${bar(Q[3],C4,"cyan")}
  <div class="panel" style="border-color:var(--yel);margin-top:16px"><b class="mono y">LECTURA AUTOMÁTICA</b>${lec.length?lec.map(x=>`<span>${esc(x)}</span>`).join(""):"<span class='g'>Se necesitan más respuestas para leer tendencias.</span>"}</div></section></div>
  <h3 style="margin-top:28px">MOSAICO // CADA PUNTO ES UNA RESPUESTA (magenta = dato, ámbar = relato, gris = sin postura)</h3><div class="dots">${L.slice().reverse().map(a=>{const s=sies(a);return `<i title="${esc((a.texto||"(sin texto)").slice(0,120))}" style="background:${s<0?C("gris"):mix(C("mag"),C("acid"),s)}"></i>`}).join("")}</div>`}

/* ---------- TIEMPO ---------- */
function tiempo(A){const L=delTema();if(L.length<2){A.innerHTML=`<h2 style="text-align:center;padding:60px 0">SE NECESITAN AL MENOS 2 RESPUESTAS PARA VER EL TIEMPO</h2>`;return}
  const f=freq(L),ws=ord(f).slice(0,6),N=L.length,mx=Math.max(1,f.get(ws[0])),pal=["mag","acid","cyan","yel","paper","gris"],X=i=>60+i*(640/(N-1)),Y=c=>270-c*(240/mx);
  const lines=ws.map((w,k)=>{let c=0;const pts=L.map((a,i)=>{if(P(a).has(w))c++;return[X(i),Y(c)]});return `<polyline fill="none" stroke="var(--${pal[k]})" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/><text x="${pts[N-1][0]+6}" y="${pts[N-1][1]+(k%2?12:-4)}" fill="var(--${pal[k]})" font-size="12">${esc(lab(w))}</text>`}).join("");
  const grid=[0,1,2,3,4].map(g=>`<line x1="60" x2="700" y1="${30+g*60}" y2="${30+g*60}" stroke="var(--gris)" opacity=".3"/><text x="52" y="${34+g*60}" text-anchor="end" fill="var(--gris)" font-size="11">${Math.round(mx*(4-g)/4)}</text>`).join("");
  const bw=Math.max(3,640/N-2),pol=L.map((a,i)=>{const s=sies(a),h=s<0?5:Math.max(4,110*s);return `<rect x="${X(i)-bw/2+(i===N-1?-bw/2:0)}" y="${130-h}" width="${bw}" height="${h}" fill="${s<0?C("gris"):mix(C("mag"),C("acid"),s)}"><title>#${i+1} ${q2t(a)}</title></rect>`}).join("");
  const bs=ws.length?ord(f).slice(0,18).map(w=>({w,c:f.get(w),r:13+11*Math.sqrt(f.get(w))})):[],pl=[];
  bs.forEach(b=>{let ang=0,rd=0;for(let k=0;k<4000;k++){const x=Math.cos(ang)*rd,y=Math.sin(ang)*rd;if(pl.every(p=>Math.hypot(p.x-x,p.y-y)>=p.r+b.r+4)){b.x=x;b.y=y;pl.push(b);break}ang+=.35;rd+=.18}});
  const e=pl.length?pl:[{x:0,y:0,r:10}],x0=Math.min(...e.map(p=>p.x-p.r)),x1=Math.max(...e.map(p=>p.x+p.r)),y0=Math.min(...e.map(p=>p.y-p.r)),y1=Math.max(...e.map(p=>p.y+p.r));
  A.innerHTML=`<div class="cols" style="grid-template-columns:2fr 1fr"><section><h3>CRECIMIENTO DE LAS PALABRAS (acumulado aporte a aporte)</h3><svg viewBox="0 0 780 300" role="img" aria-label="Crecimiento acumulado de palabras">${grid}${lines}<text x="60" y="292" fill="var(--gris)" font-size="11">APORTE 1</text><text x="700" y="292" text-anchor="end" fill="var(--gris)" font-size="11">APORTE ${N}</text></svg>
  <h3 style="margin-top:20px">POSTURA POR RESPUESTA (alto = relato · bajo = dato)</h3><svg viewBox="0 0 780 140" role="img" aria-label="Polaridad por aporte">${pol}<line x1="50" x2="710" y1="130" y2="130" stroke="var(--gris)"/></svg></section>
  <section><h3>NUBE DE IDEAS</h3><svg viewBox="${x0-8} ${y0-8} ${x1-x0+16} ${y1-y0+16}" role="img" aria-label="Nube de ideas">${pl.map(b=>{const col=b.c>=3?"mag":b.c===2?"acid":"cyan";return `<circle cx="${b.x}" cy="${b.y}" r="${b.r}" fill="var(--${col})" opacity=".85"><title>${esc(lab(b.w))}: ${b.c}</title></circle>${b.r>26?`<text x="${b.x}" y="${b.y+4}" text-anchor="middle" fill="var(--on)" font-size="${Math.min(15,b.r*.42)}">${esc(lab(b.w).slice(0,11))}</text>`:""}`}).join("")}</svg></section></div>`}

/* ---------- acciones ---------- */
function leer(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-CO";speechSynthesis.speak(u)}catch(e){toast("No hay voz disponible")}}
async function csv(){const L=delTema(),f=freq(L),rows=[["id","fecha","p1_imagen","p2_postura","p3_expresa","p3_otra","p4_comprender","p4_otra","palabras_clave"]];
  L.forEach(a=>rows.push([a.id,new Date(a.t).toISOString(),a.texto,a.q2>=0?Q[1].o[a.q2]:"",(a.q3||[]).map(i=>Q[2].c[i]).join("|"),a.q3o||"",(a.q4||[]).map(i=>Q[3].c[i]).join("|"),a.q4o||"",[...P(a)].filter(w=>f.get(w)>=2).map(lab).join("|")]));
  const data="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  try{const b=new Blob([data],{type:"text/csv;charset=utf-8"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="quien_mueve_que.csv";document.body.appendChild(l);l.click();l.remove();return}catch(e){}
  toast("La descarga no está disponible en este navegador")}
const ACT={
  go:t=>go(t.dataset.v),
  q2:t=>{const i=+t.dataset.i;S.sel.q2=S.sel.q2===i?-1:i;paintSel()},
  mc:t=>{const a=S.sel[t.dataset.q],i=+t.dataset.i,k=a.indexOf(i);k<0?a.push(i):a.splice(k,1);paintSel()},
  enviar:async()=>{const tx=S.draft.tx.trim(),s=S.sel;if(!tx&&s.q2<0&&!s.q3.length&&!s.q4.length){toast("RESPONDE AL MENOS UNA PREGUNTA");return}
    await guardar("aportes",{id:uid(),tema:S.tema,texto:tx,q2:s.q2,q3:[...s.q3],q3o:s.q3.includes(6)?S.draft.o3.trim():"",q4:[...s.q4],q4o:s.q4.includes(7)?S.draft.o4.trim():"",t:Date.now()});
    S.draft={tx:"",o3:"",o4:""};S.sel={q2:-1,q3:[],q4:[]};burst();gracias()},
  kw:t=>{S.buscar=t.dataset.w;if(S.v!=="aportes")return;render()},
  leer:t=>{const a=S.ap.find(x=>x.id===t.dataset.id);if(a)leer(a.texto)},
  leerUlt:()=>{const L=delTema();if(L.length)leer(L[L.length-1].texto)},
  conectar:t=>selec(t.dataset.id),
  modoCon:()=>{S.conectando=!S.conectando;S.selA=null;render()},
  vista:()=>{const M=["PALABRAS","APORTES","MIRADAS"];S.modoRed=M[(M.indexOf(S.modoRed)+1)%3];S.selA=null;render()},
  sembrar:async()=>{if(S.ap.some(a=>a.demo)){pend.ap=pend.ap.filter(a=>!a.demo);pend.vi=pend.vi.filter(a=>!a.demo);LS.s("cc_ap",pend.ap);LS.s("cc_vi",pend.vi);merge();render();return}
    const tx=["Sería una espiral naranja y azul, con trazos rápidos como la pelota y texturas suaves como el sudor.","Lo veo como una estela de color rojo y luz: el brazo dejando una huella en el aire.","Una mancha azul que se estira con la velocidad, con bordes difusos y mucha energía.","Dibujaría líneas rojas y curvas, como una danza entre el cuerpo y la pelota.","Una textura rugosa, colores cálidos y una figura que se dobla buscando equilibrio.","Una animación: una huella luminosa que cambia de color según la velocidad del golpe."],
      d=[[0,[0,2],[0,2]],[1,[5,3],[4,5]],[2,[0,1,3],[2,6]],[1,[4,5],[3,5]],[2,[1,3],[1,3,4]],[0,[0,2],[0,5,6]]],now=Date.now();
    for(let i=0;i<6;i++)await guardar("aportes",{id:"demo-"+i,tema:S.tema,texto:tx[i],q2:d[i][0],q3:d[i][1],q3o:"",q4:d[i][2],q4o:"",t:now-(6-i)*72e5},true);
    await guardar("vinculos",{id:"demo-v",tema:S.tema,a:"p:color",b:"p:velocidad",nota:"el color puede mostrar qué tan rápido es el movimiento",t:now},true);
    render()},
  csv,
  csv,
  hc:()=>{const h=document.documentElement;h.dataset.hc=h.dataset.hc==="1"?"0":"1";LS.s("cc_hc",h.dataset.hc);render()},
  fs:t=>{const v=cl((+getComputedStyle(document.documentElement).getPropertyValue("--fs")||1)+ +t.dataset.d,.9,1.4);document.documentElement.style.setProperty("--fs",v.toFixed(1));LS.s("cc_fs",v)},
  kiosco:()=>entrarKiosco()
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&ACT[t.dataset.a])ACT[t.dataset.a](t)});

/* ---------- kiosco / proyección ---------- */
let kT=0,kI=0,act=Date.now(),kStart=0;
function entrarKiosco(){if(S.kiosco||!S.ap.length)return;S.kiosco=true;kStart=Date.now();document.body.classList.add("kiosk");const seq=["red","datos","tiempo","aportes"];kI=0;go(seq[0]);kT=setInterval(()=>{kI=(kI+1)%4;go(seq[kI])},14000)}
function salirKiosco(){if(!S.kiosco||Date.now()-kStart<500)return;S.kiosco=false;clearInterval(kT);document.body.classList.remove("kiosk");act=Date.now();render()}
["pointerdown","keydown"].forEach(ev=>addEventListener(ev,()=>{act=Date.now();salirKiosco()}));
addEventListener("pointermove",()=>act=Date.now());
setInterval(()=>{if(!S.kiosco&&Date.now()-act>9e4&&S.ap.length&&!(document.activeElement&&["INPUT","TEXTAREA"].includes(document.activeElement.tagName)))entrarKiosco()},5000);
setInterval(guardarVisita,3e4);addEventListener("pagehide",guardarVisita);

/* ---------- arranque ---------- */
document.documentElement.dataset.hc=LS.g("cc_hc","0");document.documentElement.style.setProperty("--fs",LS.g("cc_fs",1));
merge();render();
(async()=>{

  try{firebase.initializeApp(firebaseConfig);DB=firebase.firestore()}catch(e){}
  if(!DB){cargado=true;merge();render();return}
  let n=0;const listo=()=>{if(++n>=2){cargado=true}};
  const ok=(set)=>s=>{set(s.docs.map(d=>({...d.data(),id:d.id})));merge();listo();refresh()},bad=()=>{listo();refresh()};
  try{DB.collection("aportes").onSnapshot(ok(x=>dbAp=x),bad);DB.collection("vinculos").onSnapshot(ok(x=>dbVi=x),bad)}catch(e){DB=null;cargado=true;render()}
  setTimeout(()=>{cargado=true},10000)
})();
